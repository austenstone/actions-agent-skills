name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.29.0

jobs:
  # The fixtures must keep producing exactly the findings test-corpus/README.md
  # documents. Drift here means a tool changed behavior and the skills' guidance
  # may now be wrong.
  corpus:
    name: Test corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the release asset directly rather than through upstream's
      # installer script, so the download gets explicit retries. A bare curl to
      # a release URL fails the whole job on any transient reset, which it did.
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" -version

      - name: Install zizmor
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      # Network audits (known-vulnerable-actions, impostor-commit) are part of
      # what the corpus asserts, so a token is required for a faithful run.
      - name: Verify fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./test-corpus/verify.sh

      # Extract the wrapper the skills tell agents to run, and run it. Reading
      # it is not enough: both tools exit non-zero on findings, so a wrapper
      # that reads fine can still abort or silently drop results when executed.
      - name: Documented wrapper executes correctly
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-wrapper-runs.sh

  # A reference-first skill set is only as good as its references.
  references:
    name: References
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skill frontmatter is valid and loadable
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-frontmatter.py

      - name: Relative links and anchors resolve
        run: python3 scripts/check-links.py

      - name: Cited URLs resolve
        run: ./scripts/check-urls.sh

      - name: No invented or stale zizmor rule names
        run: ./scripts/check-audit-idents.sh

      - name: Cited action references exist and are current
        run: ./scripts/check-action-refs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Documented shell recipes cannot silently drop findings
        run: python3 scripts/check-recipes.py

  # Dogfood. A workflow-security skill whose own CI fails its own review is not
  # worth reading.
  self-review:
    name: Self review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the release asset directly rather than through upstream's
      # installer script, so the download gets explicit retries. A bare curl to
      # a release URL fails the whole job on any transient reset, which it did.
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" -version

      - name: Install zizmor
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/

      - name: shellcheck
        run: shellcheck scripts/*.sh test-corpus/verify.sh
