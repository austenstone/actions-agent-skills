# Deliberately broken — validation fixture for actionlint's correctness plane.
# zizmor sees almost nothing wrong here; every one of these is a real bug that
# would fail at runtime or silently never run.
name: broken-fixture

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 25 * * *' # invalid hour

jobs:
  typo-runner:
    runs-on: ubuntu-lastest # typo'd label
    steps:
      - run: echo hi

  bad-needs:
    runs-on: ubuntu-latest
    needs: [does-not-exist]
    steps:
      - run: echo hi

  bad-context:
    runs-on: ubuntu-latest
    steps:
      # github.repositry does not exist
      - run: echo "${{ github.repositry }}"
      # comparing a string to a number
      - if: ${{ github.event_name == 1 }}
        run: echo hi
      # references a step id that was never defined
      - run: echo "${{ steps.nope.outputs.value }}"

  bad-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      # wrong matrix key
      - run: echo "${{ matrix.nodejs }}"

  bad-shell:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ $UNSET_VAR == "x" ]; then
            echo yes
          fi
