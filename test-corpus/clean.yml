# The false-positive control. A well-written workflow.
# MUST produce zero zizmor findings and zero actionlint errors.
# If a skill flags anything here, that skill is too noisy and gets ignored.
name: clean-fixture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege at the top; jobs opt in to more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Untrusted input passed via env, never interpolated into the script.
      - name: Report title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "Testing $PR_TITLE"

      - name: Test
        run: npm test
